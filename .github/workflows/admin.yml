name: admin
on:
  push:
    branches: [main]
    paths: [apps/admin/**, .github/workflows/admin.yml]
  pull_request:
    paths: [apps/admin/**, .github/workflows/admin.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Back-office : qualité du code, puis image construite et scannée telle
# qu'elle sera déployée. Une faille HIGH/CRITICAL corrigeable bloque : on
# met à jour, on ne la masque pas dans .trivyignore.
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/admin/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc -b --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npx vite build
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Dépendances npm (failles HIGH/CRITICAL)
        run: trivy fs --no-progress --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed package-lock.json

  image:
    runs-on: ubuntu-24.04
    needs: [quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/admin/Dockerfile
      - name: Compose validation
        run: docker compose config -q
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder
      - name: Build image
        run: docker build -t memo-admin:ci .
      - uses: aquasecurity/setup-trivy@v0.3.1
      - name: Trivy image scan
        run: >-
          trivy image --no-progress --exit-code 1
          --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed
          memo-admin:ci
      - name: SBOM
        run: trivy image --no-progress --format spdx-json --output memo-admin.sbom.spdx.json memo-admin:ci
      - uses: actions/upload-artifact@v4
        with:
          name: memo-admin-sbom
          path: apps/admin/memo-admin.sbom.spdx.json
          retention-days: 30
