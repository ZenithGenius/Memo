version: 2
updates:
  - package-ecosystem: pub
    directory: /apps/memo_app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  # Image de base du panneau admin, épinglée par empreinte : Dependabot
  # propose la nouvelle empreinte quand l'image est republiée (correctifs).
  - package-ecosystem: docker
    directory: /backend/admin
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
