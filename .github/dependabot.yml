version: 2
updates:
  - package-ecosystem: pub
    directory: /apps/memo_app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  # Back-office : dépendances npm, regroupées pour limiter le bruit.
  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      admin-npm:
        patterns: ["*"]
  # Images de base du back-office, épinglées par empreinte : Dependabot
  # propose la nouvelle empreinte quand l'image est republiée (correctifs).
  - package-ecosystem: docker
    directory: /apps/admin
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
