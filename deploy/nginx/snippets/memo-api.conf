# Seules les routes publiques de Supabase sont transmises à la passerelle.
# Studio, postgres-meta et les autres routes de la passerelle restent internes.
client_max_body_size 2m;

location ~ ^/(auth|rest|storage|functions)/v1/ {
    proxy_pass http://$memo_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
}

location / {
    return 404;
}
