<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Work+Sans:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Work Sans', system-ui, sans-serif; }
    a { color: #E8A93E; } a:hover { color: #C98F2C; }
  </style>
</helmet>
<div style="background:#FAF6EE; min-height:100%; padding:28px; display:flex; flex-direction:column; gap:24px; box-sizing:border-box;">

  <div>
    <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#B08A3E; font-weight:700;">Direction C</div>
    <h2 style="margin:4px 0 0; font-size:26px; color:#1B3A4B; font-weight:700; font-family:'Poppins', sans-serif;">Community Pattern</h2>
    <p style="margin:6px 0 0; font-size:13.5px; color:#3E5A68; line-height:1.5;">Indigo + gold two-tone, subtle geometric motif nodding to local textile patterns.</p>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#B08A3E; font-weight:700; margin-bottom:10px;">Palette</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:10px;background:#1B3A4B;"></div>
        <span style="font-size:10px;color:#3E5A68;">1B3A4B</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:10px;background:#E8A93E;"></div>
        <span style="font-size:10px;color:#3E5A68;">E8A93E</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:10px;background:#FAF6EE;border:1px solid #E9DEC7;"></div>
        <span style="font-size:10px;color:#3E5A68;">FAF6EE</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:10px;background:#B24C2D;"></div>
        <span style="font-size:10px;color:#3E5A68;">B24C2D</span>
      </div>
    </div>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#B08A3E; font-weight:700; margin-bottom:8px;">Type — Poppins / Work Sans</div>
    <div style="font-size:28px; font-weight:700; color:#1B3A4B; line-height:1.2; font-family:'Poppins', sans-serif;">Je veux de l'eau</div>
    <div style="font-size:14.5px; font-weight:500; color:#3E5A68; margin-top:4px;">Corps de texte — chaleureux, ancré, sans surcharge.</div>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#B08A3E; font-weight:700; margin-bottom:10px;">Components</div>
    <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;">
      <div style="width:116px;height:124px;border-radius:18px;background:#FFFFFF;border:2px solid #EDE1C6;overflow:hidden;display:flex;flex-direction:column;align-items:center;">
        <svg width="116" height="10" viewBox="0 0 116 10" style="display:block;">
          <path d="M0 10 L10 0 L20 10 L30 0 L40 10 L50 0 L60 10 L70 0 L80 10 L90 0 L100 10 L110 0 L116 5" fill="none" stroke="#E8A93E" stroke-width="2"/>
        </svg>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B3A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3 3-6 5-6 9a6 6 0 0 0 12 0c0-4-3-6-6-9Z"/></svg>
          <span style="font-size:13px;font-weight:600;color:#1B3A4B;">Boire</span>
        </div>
      </div>
      <button style="display:flex;align-items:center;gap:10px;min-height:52px; padding:0 20px; border-radius:26px; background:#E8A93E; color:#1B3A4B; border:none; font-family:inherit; font-size:15px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B3A4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 5V4L9 9H5Z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
        <span>Lire le message</span>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
