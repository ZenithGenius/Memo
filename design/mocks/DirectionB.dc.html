<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #0B5FFF; } a:hover { color: #0846C4; }
  </style>
</helmet>
<div style="background:#FFFFFF; min-height:100%; padding:28px; display:flex; flex-direction:column; gap:24px; box-sizing:border-box;">

  <div>
    <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#6B6B6B; font-weight:700;">Direction B</div>
    <h2 style="margin:4px 0 0; font-size:26px; color:#141414; font-weight:700;">High-Contrast Clarity</h2>
    <p style="margin:6px 0 0; font-size:13.5px; color:#4A4A4A; line-height:1.5;">Stark black/white base, one vivid accent used sparingly. Neutral, adult-friendly, maximum legibility.</p>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#6B6B6B; font-weight:700; margin-bottom:10px;">Palette</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:6px;background:#141414;"></div>
        <span style="font-size:10px;color:#6B6B6B;">141414</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:6px;background:#FFFFFF;border:1px solid #D9D9D9;"></div>
        <span style="font-size:10px;color:#6B6B6B;">FFFFFF</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:6px;background:#0B5FFF;"></div>
        <span style="font-size:10px;color:#6B6B6B;">0B5FFF</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:44px;height:44px;border-radius:6px;background:#F2F2F2;"></div>
        <span style="font-size:10px;color:#6B6B6B;">F2F2F2</span>
      </div>
    </div>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#6B6B6B; font-weight:700; margin-bottom:8px;">Type — IBM Plex Sans</div>
    <div style="font-size:28px; font-weight:700; color:#141414; line-height:1.2;">Je veux de l'eau</div>
    <div style="font-size:14.5px; font-weight:500; color:#3D3D3D; margin-top:4px;">Corps de texte — sobre, fonctionnel, sans décor.</div>
  </div>

  <div>
    <div style="font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#6B6B6B; font-weight:700; margin-bottom:10px;">Components</div>
    <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap;">
      <div style="width:116px;height:116px;border-radius:8px;background:#FFFFFF;border:3px solid #141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0B5FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-3 3-6 5-6 9a6 6 0 0 0 12 0c0-4-3-6-6-9Z"/></svg>
        <span style="font-size:13px;font-weight:700;color:#141414;">Boire</span>
      </div>
      <button style="display:flex;align-items:center;gap:10px;min-height:52px; padding:0 20px; border-radius:8px; background:#141414; color:#FFFFFF; border:2px solid #0B5FFF; font-family:inherit; font-size:15px; font-weight:600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 5V4L9 9H5Z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
        <span>Lire le message</span>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
